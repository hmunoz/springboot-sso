server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Resolver DNS interno de Docker para actualizar IPs dinamicamente si se recrean contenedores
    resolver 127.0.0.11 valid=10s;

    # =========================================================================
    # 1. Keycloak SSO (Autenticacion, OIDC discovery, Login y Tokens)
    # =========================================================================
    location ~ ^/(realms|resources|js|admin)/ {
        proxy_pass http://video-keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # =========================================================================
    # 2. Spring Cloud API Gateway (APIs REST, Agent, MCP Servers y Discovery)
    #    Nginx actua como Edge Ingress; el Gateway resuelve toda la topologia
    # =========================================================================
    location / {
        proxy_pass http://videoclub-gateway:9500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming / Server-Sent Events (SSE) y soporte MCP
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
