spring:
  application:
    # Etiqueta `application` de las metricas de Prometheus: si los dos servicios
    # comparten nombre, sus series se mezclan en el mismo grafico.
    name: catalog-service
  config:
    import:
      # En cascada a proposito. Al correr `./mvnw spring-boot:run` desde esta carpeta,
      # el working directory es catalog-service/ y el `.env` vive en la raiz del repo.
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Servidor MCP (Model Context Protocol).
  # protocol: SSE | STREAMABLE | STATELESS. STATELESS resuelve cada llamada como un POST
  # normal, de modo que el SecurityContext y los @PreAuthorize de las tools se evaluan
  # igual que en cualquier endpoint REST y el token se revalida en cada request.
  ai:
    mcp:
      server:
        name: videoclub-catalog-mcp-server
        version: 1.0.0
        type: sync
        protocol: stateless
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >
          Herramientas del catalogo de peliculas del VideoClub UNRN: listado, busqueda,
          consulta por id y alta de peliculas. No expone datos de socios.

  #Seguridad
  # Un OAuth2 Resource Server no necesita estar registrado como client en Keycloak:
  # le alcanza con el issuer y las claves publicas para verificar la firma del token.
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:videoclub}}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/certs}

  # Conexion a RabbitMQ preconfigurada (decision D6). Catalogo es productor del evento de
  # dominio Movie (ver docs/plan/plan-carrito-ecst-rabbitmq.md, Fase 1): publica en el
  # exchange de negocio videoclub.events, pero no declara ni consume ninguna cola propia.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASS:rabbitmq}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Without publisher confirms a failed publish raises nothing and the domain event
    # is lost silently. MovieEventPublisher waits on these confirmations.
    publisher-confirm-type: correlated
    publisher-returns: true

  #Base de datos
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/video_catalog}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:P4ssword!}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  docker:
    compose:
      # Apagado por default: son dos servicios independientes y cada uno intentaria
      # levantar el mismo stack de infraestructura. Se arranca a mano:
      #   docker compose -f docker/services.yaml up -d
      file: ../docker/services.yaml
      lifecycle-management: start_only
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
  mvc:
    problemdetails:
      enabled: true

# swagger y keycloak integration
# http://localhost:8081/swagger-ui/index.html
springdoc:
  oauth2:
    authorization-url: "${KEYCLOAK_AUTH_URL:${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/auth}"
    token-url: "${KEYCLOAK_TOKEN_URL:${KEYCLOAK_URL:http://localhost:9090}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/token}"
  api-docs:
    enabled: true
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    url: "/api-docs"
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:videoclub-frontend}
      realm: ${KEYCLOAK_REALM:videoclub}
      use-pkce-with-authorization-code-grant: true

videoclub:
  mcp:
    # Identificador publico del recurso MCP que se anuncia en /.well-known/oauth-protected-resource.
    # Tiene que apuntar al puerto de ESTE servicio o se anuncia un recurso que no existe.
    resource-uri: ${MCP_RESOURCE_URI:http://localhost:8081/mcp}
  rabbitmq:
    exchange: ${VIDEOCLUB_EXCHANGE:videoclub.events}

# Sin bloque `keycloak.admin.*` a proposito: catalog-service no llama a la Admin REST API
# de Keycloak, asi que el secreto de `videoclub-backend` no tiene por que llegar aca.
# Ver docs/arquitectura-dos-servicios.md, decision D5 y trampa C7.

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    context-path: /
  forward-headers-strategy: framework

# Enable Actuator endpoints in application.yml
management:
  security:
    enabled: false
  endpoints:
    enabled-by-default: false
    web:
      base-path: /metrics
      exposure:
        include: "health,info,prometheus"
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
