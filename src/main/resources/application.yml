spring:
  application:
    name: video
  config:
    import:
      - optional:file:.env[.properties]

  #Seguridad
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:9091}/realms/${KEYCLOAK_REALM:videoclub}}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_URL:http://localhost:9091}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/certs}
  #Base de datos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:rabbitmq}
    password: ${RABBITMQ_PASS:rabbitmq}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Without publisher confirms a failed publish raises nothing and the domain event
    # is lost silently. MessagePublisher waits on these confirmations.
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # One consumer keeps queue ordering, which the CREATE -> UPDATE -> DELETE
        # sequence relies on.
        concurrency: 1
        # Retry transient failures (a database restart, a brief network hiccup) before
        # the message is treated as poisoned and dead-lettered.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/video}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:P4ssword!}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  docker:
    compose:
      file: ./docker/services.yaml
      lifecycle-management: start_only
      enabled: true
  mvc:
    problemdetails:
      enabled: true

# swagger y keycloak integration
# http://localhost:8080/swagger-ui/index.html
springdoc:
  oauth2:
    authorization-url: "${KEYCLOAK_AUTH_URL:${KEYCLOAK_URL:http://localhost:9091}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/auth}"
    token-url: "${KEYCLOAK_TOKEN_URL:${KEYCLOAK_URL:http://localhost:9091}/realms/${KEYCLOAK_REALM:videoclub}/protocol/openid-connect/token}"
  api-docs:
    enabled: true
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    url: "/api-docs"
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:videoclub-frontend}
      realm: ${KEYCLOAK_REALM:videoclub}
      use-pkce-with-authorization-code-grant: true

videoclub:
  rabbitmq:
    exchange: ${VIDEOCLUB_EXCHANGE:videoclub.events}
    socio-queue: ${VIDEOCLUB_SOCIO_QUEUE:socio.events.queue}

keycloak:
  admin:
    url: ${KEYCLOAK_URL:http://localhost:9091}
    realm: ${KEYCLOAK_REALM:videoclub}
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:videoclub-backend}
    client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:dstNSsANvqlaGfZCJa1mcYzP1EBAYP4N}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:keycloak.events}
    queue: ${KEYCLOAK_RABBITMQ_QUEUE:keycloak-events}
    routing-keys:
      - "keycloak.user.#"
      - "keycloak.admin.USER.*"

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    context-path: /
  forward-headers-strategy: framework

# Enable Actuator endpoints in application.yml
management:
  security:
    enabled: false
  endpoints:
    enabled-by-default: false
    web:
      base-path: /metrics
      exposure:
        include: "health,info,prometheus"
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
    prometheus:
      enabled: true